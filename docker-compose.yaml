networks:
  fapi2-net:
    name: fapi2-net

services:
  kong-db:
    image: postgres:15
    container_name: fapi2-kong-db
    restart: unless-stopped
    networks:
      - fapi2-net
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:15
    container_name: fapi2-keycloak-db
    restart: unless-stopped
    networks:
      - fapi2-net
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.1.5}
    container_name: fapi2-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    networks:
      fapi2-net:
        aliases:
          - keycloak.localhost
    ports:
      - "9080:9080"
      # HTTPS port for 検証 3 (Kong = RP × mTLS).
      - "9443:9443"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Listen on 9080 inside the container so the same URL
      # (http://keycloak.localhost:9080) works both from the browser
      # (via host port 9080) and from Kong (via the fapi2-net
      # `keycloak.localhost` network alias on port 9080).
      # Single URL keeps client_assertion `aud` validation simple
      # for FAPI 2.0 RP mode.
      KC_HTTP_PORT: 9080
      KC_HOSTNAME: http://keycloak.localhost:9080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_FEATURES: dpop
      # ── HTTPS (mTLS) for 検証 3 ────────────────────────────
      # Keycloak listens on 9443 for HTTPS in addition to 9080 HTTP.
      # The mtls.endpoint.aliases discovery field (set per-realm)
      # tells RPs to call PAR/token endpoints over the HTTPS+mTLS
      # listener when they wish to obtain a certificate-bound token.
      KC_HTTPS_PORT: 9443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/keycloak-cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/keycloak-key.pem
      # Use the new (Keycloak 26+) KC_TRUSTSTORE_PATHS approach:
      # point to the directory containing the CA PEM that signed
      # Kong's client cert. Keycloak loads every PEM/CRT file in
      # the listed paths and uses them for client cert validation.
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/tls/ca-cert.pem
      # `request` = mTLS is optional (HTTPS is reachable without a
      # client cert; cert is only mandatory on mtls.endpoint.aliases
      # endpoints inside the realm).
      KC_HTTPS_CLIENT_AUTH: request
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import
      - ./tls:/opt/keycloak/conf/tls:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  kong-migrations:
    image: kong/kong-gateway:${KONG_VERSION:-3.10.0.7}
    container_name: fapi2-kong-migrations
    networks:
      - fapi2-net
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_LICENSE_DATA: ${KONG_LICENSE_DATA}
    depends_on:
      kong-db:
        condition: service_healthy

  httpbin:
    image: kong/httpbin:latest
    container_name: fapi2-httpbin
    restart: unless-stopped
    networks:
      - fapi2-net

  kong:
    image: kong/kong-gateway:${KONG_VERSION:-3.10.0.7}
    container_name: fapi2-kong
    restart: unless-stopped
    networks:
      - fapi2-net
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
      - "8444:8444"
    volumes:
      - ./tls:/etc/kong/tls:ro
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_LICENSE_DATA: ${KONG_LICENSE_DATA}
      # Trust the local PoC CA so Kong can verify Keycloak's HTTPS
      # cert when calling token / PAR endpoints over mTLS (検証 3).
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /etc/kong/tls/ca-cert.pem
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
