services:
  - name: rp-mtls-protected
    url: http://httpbin/anything
    plugins:
      - name: openid-connect
        config:
          # ── Issuer (pseudo) ──
          issuer: ${{ env "DECK_ISSUER" }}
          using_pseudo_issuer: true

          # ── Endpoints (mTLS aliases on HTTPS port 9443) ──
          # Keycloak publishes mtls_endpoint_aliases in its
          # discovery doc when a cert-bound client exists; we hard-
          # code those URLs here because using_pseudo_issuer skips
          # discovery.
          pushed_authorization_request_endpoint: https://keycloak.localhost:9443/realms/fapi2/protocol/openid-connect/ext/par/request
          token_endpoint: https://keycloak.localhost:9443/realms/fapi2/protocol/openid-connect/token
          jwks_endpoint: http://keycloak.localhost:9080/realms/fapi2/protocol/openid-connect/certs
          authorization_endpoint: http://keycloak.localhost:9080/realms/fapi2/protocol/openid-connect/auth
          end_session_endpoint: http://keycloak.localhost:9080/realms/fapi2/protocol/openid-connect/logout

          # ── Client identity & mTLS authentication ──
          client_id:
            - kong-rp-mtls-client
          client_auth:
            - tls_client_auth
          # The Kong Certificate entity declared above. Kong presents
          # this cert+key when calling PAR / token endpoints over
          # HTTPS, completing the mTLS handshake against Keycloak.
          tls_client_auth_cert_id: ce451e1b-9c1e-4184-bc22-3e001336e8ed
          tls_client_auth_ssl_verify: true

          # ── Operating mode ──
          auth_methods:
            - authorization_code
            - session
          redirect_uri:
            - http://localhost:8000/protected-mtls
          login_redirect_uri:
            - http://localhost:8000/protected-mtls
          logout_redirect_uri:
            - http://localhost:8000/

          scopes:
            - openid
            - profile

          # ── FAPI 2.0 Security Profile requirements ──
          require_pushed_authorization_requests: true
          require_proof_key_for_code_exchange: true
          # JAR (signed request object) — uses tls_client_auth's
          # certificate / key for signing as Kong does not get a
          # separate request_object_signing_key here. Some plugin
          # versions require client_jwk for JAR; kept off for now.
          # require_signed_request_object: true

          # ── Session ──
          session_storage: cookie
          session_cookie_name: kong_rp_mtls_session
          session_cookie_http_only: true
          session_cookie_same_site: Lax
          session_secret: change-me-in-production-fapi2-rp-mtls-session-secret
          session_absolute_timeout: 3600

          # ── Forwarding user info ──
          upstream_headers_claims:
            - sub
            - preferred_username
            - groups
          upstream_headers_names:
            - x-userinfo-sub
            - x-userinfo-username
            - x-userinfo-groups

          logout_methods:
            - GET
          logout_uri_suffix: /logout
          logout_revoke: true
          logout_revoke_access_token: true

          display_errors: true

    routes:
      - name: rp-mtls-protected-route
        paths:
          - /protected-mtls
        protocols:
          - http
          - https
