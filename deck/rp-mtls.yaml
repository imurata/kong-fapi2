_format_version: "3.0"

# ============================================================
# Kong Gateway as FAPI 2.0 Relying Party (mTLS variant)
# ------------------------------------------------------------
# This deck file makes Kong terminate the OIDC flow and obtain
# *certificate-bound* (sender-constrained) access tokens from
# Keycloak using mTLS client authentication (RFC 8705).
#
# Differences from deck/rp.yaml:
#   - client_auth: tls_client_auth (was: private_key_jwt)
#   - tls_client_auth_cert_id points to a Kong Certificate entity
#   - All token / PAR endpoints are HTTPS on port 9443 (mTLS)
#   - Kong verifies the Keycloak server cert against the same
#     internal CA (tls_client_auth_ssl_verify: true)
# ============================================================

