          # ── Operating mode ──
          auth_methods:
            - authorization_code
            - session
          redirect_uri:
            - http://localhost:8000/protected-mtls
          login_redirect_uri:
            - http://localhost:8000/protected-mtls
          logout_redirect_uri:
            - http://localhost:8000/

          scopes:
            - openid
            - profile

          # ── FAPI 2.0 Security Profile requirements ──
          require_pushed_authorization_requests: true
          require_proof_key_for_code_exchange: true
          # ── FAPI 2.0 Message Signing (JAR option) ──
          # Sign the PAR Request Object with the client_jwk above
          # (PS256). Keycloak verifies the signature against the
          # public JWK registered on the kong-rp-mtls-client.
          require_signed_request_object: true

          # ── Session ──
          session_storage: cookie
          session_cookie_name: kong_rp_mtls_session
          session_cookie_http_only: true
          session_cookie_same_site: Lax
          session_secret: change-me-in-production-fapi2-rp-mtls-session-secret
          session_absolute_timeout: 3600

          # ── Forwarding user info ──
          upstream_headers_claims:
            - sub
            - preferred_username
            - groups
          upstream_headers_names:
            - x-userinfo-sub
            - x-userinfo-username
            - x-userinfo-groups

          logout_methods:
            - GET
          logout_uri_suffix: /logout
          logout_revoke: true
          logout_revoke_access_token: true

          display_errors: true

    routes:
      - name: rp-mtls-protected-route
        paths:
          - /protected-mtls
        protocols:
          - http
          - https
